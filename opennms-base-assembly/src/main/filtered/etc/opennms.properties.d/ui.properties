##############################################################################
#  OpenNMS UI experience selector
#
#  Controls which web interface is served when users navigate to OpenNMS.
#
#  Values:
#    classic  (default) The original OpenNMS web interface.
#    next     The redesigned Vue-based interface with dark mode support.
#
#  A full restart of OpenNMS is required after changing this value.
#
#  Command-line shortcut (as the opennms user):
#    $OPENNMS_HOME/bin/opennms-ui use next
#    $OPENNMS_HOME/bin/opennms-ui use classic
##############################################################################
#org.opennms.web.ui=next
